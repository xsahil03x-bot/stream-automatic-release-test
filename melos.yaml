name: StreamAutomaticReleaseTest

packages:
  - packages/**

command:
  bootstrap:
    environment:
      sdk: ">=3.0.0 <4.0.0"

scripts:
  lint:pub:
    run: melos exec -c 1 --no-private --order-dependents -- "flutter pub publish -n"
    description: Dry run `pub publish` for unpublished packages, in dependency order.

    description: Tag unpublished packages and push, in dependency order.

    description: Publish unpublished packages to pub.dev, in dependency order.

  release:pub:
    run: melos exec -c 1 --no-published --no-private --order-dependents -- "flutter pub publish -f"
    description: Publish the scoped package to pub.dev (OIDC in CI). Set MELOS_PACKAGES.

